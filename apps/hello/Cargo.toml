[package]
license.workspace = true
name = "ev-native-hello"
version.workspace = true
edition.workspace = true
publish.workspace = true
[[bin]]
name = "ev-native-hello"
path = "src/main.rs"
required-features = ["executable"]
test = false
bench = false
[features]
document-workflow = ["native-session"]
native-session = ["dep:ev-app-registry", "dep:ev-zion"]
startup-health = ["native-session"]
network-negative-probe = ["native-session"]
executable = []
native-a = ["executable"]
native-b = ["executable"]
downloaded-b = ["native-b", "startup-health"]
downloaded-c = ["native-a", "startup-health"]
[dependencies]
ev-userspace-contract = { path = "../../libs/userspace-contract" }
ev-userspace-runtime = { path = "../../libs/userspace-runtime" }
ev-userspace-graphics = { path = "../../libs/userspace-graphics" }
ev-graphics = { path = "../../libs/graphics" }
ev-input = { path = "../../libs/input" }
ev-desktop = { path = "../../services/desktop" }
ev-app-registry = { path = "../../libs/app-registry", optional = true }
ev-zion = { path = "../../libs/zion", optional = true }
[dev-dependencies]
ev-zion = { path = "../../libs/zion" }
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
