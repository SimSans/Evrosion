[package]
name = "ev-native-hello"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
[[bin]]
name = "ev-native-hello"
path = "src/main.rs"
required-features = ["executable"]
test = false
bench = false
[features]
executable = []
native-a = ["executable"]
native-b = ["executable"]
[dependencies]
ev-userspace-contract = { path = "../../libs/userspace-contract" }
ev-userspace-runtime = { path = "../../libs/userspace-runtime" }
ev-userspace-graphics = { path = "../../libs/userspace-graphics" }
ev-graphics = { path = "../../libs/graphics" }
ev-input = { path = "../../libs/input" }
ev-desktop = { path = "../../services/desktop" }
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
