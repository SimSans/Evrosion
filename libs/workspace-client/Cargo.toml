[package]
license.workspace = true
name = "ev-workspace-client"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
ev-userspace-contract = { path = "../userspace-contract" }
ev-userspace-runtime = { path = "../userspace-runtime" }
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
