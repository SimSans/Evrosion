[package]
name = "ev-net-driver"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-only"

[[bin]]
name = "ev-net-driver"
path = "src/main.rs"
required-features = ["driver-executable"]
test = false
bench = false

[[bin]]
name = "ev-net-service"
path = "src/service_main.rs"
required-features = ["stack-executable"]
test = false
bench = false

[features]
executable = []
driver-executable = ["executable"]
probe = ["driver-executable"]
driver-service = ["driver-executable"]
stack-service = ["dep:ev-net-stack"]
stack-executable = ["stack-service", "executable"]
# Separate measured M8 binaries keep ordinary v1 startup/role functions exact.
workspace-profile = []

[dependencies]
ev-net-device = { path = "../../libs/net-device" }
ev-net-stack = { path = "../../libs/net-stack", optional = true }
ev-userspace-contract = { path = "../../libs/userspace-contract" }
ev-userspace-runtime = { path = "../../libs/userspace-runtime" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
