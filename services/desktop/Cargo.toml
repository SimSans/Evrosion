[package]
name="ev-desktop"
version.workspace=true
edition.workspace=true
publish.workspace=true
license.workspace = true
[[bin]]
name="ev-desktop"
path="src/main.rs"
required-features=["executable"]
test=false
bench=false
[features]
executable=[]
app=["executable"]
interactive=["app"]
display=["executable"]
compositor=["display"]
input=["executable"]
shell=["executable"]
native-shell=["shell"]
native-bad-shell=["native-shell"]
app-denied-framebuffer=["app"]
display-denied-surface=["display"]
[dependencies]
ev-graphics={path="../../libs/graphics"}
ev-input={path="../../libs/input"}
ev-userspace-contract={path="../../libs/userspace-contract"}
ev-userspace-runtime={path="../../libs/userspace-runtime"}
[lints.rust]
unsafe_op_in_unsafe_fn="deny"
unused_unsafe="deny"
[lints.clippy]
all={level="warn",priority=-1}
undocumented_unsafe_blocks="deny"
