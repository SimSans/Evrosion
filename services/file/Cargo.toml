[package]
license.workspace = true
name="ev-file-service"
version.workspace=true
edition.workspace=true
publish.workspace=true
[[bin]]
name="ev-file-service"
path="src/main.rs"
required-features=["executable"]
test=false
bench=false
[features]
native-session=["desktop"]
executable=[]
server=["executable","dep:ev-block-service","ev-block-service/test-store-client"]
app=["executable"]
desktop=["server"]
desktop-provision=["desktop"]
[dependencies]
ev-file={path="../../libs/file"}
ev-store={path="../../libs/store"}
ev-userspace-contract={path="../../libs/userspace-contract"}
ev-userspace-runtime={path="../../libs/userspace-runtime"}
ev-block-service={path="../block",optional=true}
sha2={version="0.10.9",default-features=false}
[lints.rust]
unsafe_op_in_unsafe_fn="deny"
unused_unsafe="deny"
[lints.clippy]
all="warn"
undocumented_unsafe_blocks="deny"
