[package]
license.workspace = true
name="ev-block-service"
version.workspace=true
edition.workspace=true
publish.workspace=true
[[bin]]
name="ev-block-service"
path="src/main.rs"
required-features=["executable"]
test=false
bench=false
[features]
pio-word4=["native-driver"]
pio-words256=["workspace-driver"]
native-session=["native-driver","pio-word4"]
native-network=["native-session"]
workspace-storage=["dep:ev-store"]
workspace-driver=["native-network","workspace-storage"]
executable=[]
test-write=["executable"]
test-verify=["executable"]
test-direct-fault=["executable"]
test-block-driver=["executable"]
test-block-client-write=["executable"]
test-block-client-verify=["executable"]
test-store-client=["executable","dep:ev-store"]
test-generation-client=["test-store-client","dep:sha2"]
test-owner-client=["test-generation-client"]
desktop-driver=["test-block-driver","test-store-client"]
native-driver=["desktop-driver"]
[dependencies]
ev-userspace-contract={path="../../libs/userspace-contract"}
ev-userspace-runtime={path="../../libs/userspace-runtime"}
ev-store={path="../../libs/store",optional=true}
sha2={version="0.10.9",default-features=false,optional=true}
[lints.rust]
unsafe_op_in_unsafe_fn="deny"
unused_unsafe="deny"
[lints.clippy]
all="warn"
undocumented_unsafe_blocks="deny"
