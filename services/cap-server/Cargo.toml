[package]
license.workspace = true
name = "ev-cap-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ev-cap-server"
path = "src/main.rs"
required-features = ["executable"]
test = false
bench = false

[features]
executable = []
test-delay = ["executable"]
test-fault = ["executable"]
test-hold = ["executable"]
test-queued-fault = ["executable"]

[dependencies]
ev-userspace-contract = { path = "../../libs/userspace-contract" }
ev-userspace-runtime = { path = "../../libs/userspace-runtime" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
