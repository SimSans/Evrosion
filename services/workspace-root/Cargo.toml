[package]
license.workspace = true
name = "ev-workspace-root"
version = "0.4.0"
edition = "2024"
publish = false

[[bin]]
name = "ev-workspace-root"
path = "src/main.rs"
required-features = ["native-actor"]
test = false
bench = false

[features]
native-actor = []

[dependencies]
ev-userspace-contract = { path = "../../libs/userspace-contract" }
ev-userspace-runtime = { path = "../../libs/userspace-runtime" }
ev-workspace-shell = { path = "../../libs/workspace-shell" }
ev-workspace-client = { path = "../../libs/workspace-client" }
ev-workspace-service = { path = "../workspace" }
ev-graphics = { path = "../../libs/graphics" }
ev-input = { path = "../../libs/input" }
ev-native-files = { path = "../../apps/files" }
ev-native-inspector = { path = "../../apps/inspector" }
ev-zion = { path = "../../libs/zion" }
ev-block-service = { path = "../block", features = ["workspace-storage"] }
ev-net-driver = { path = "../net-driver" }
ev-store = { path = "../../libs/store" }
ev-app-registry = { path = "../../libs/app-registry" }

sha2 = { version = "=0.10.9", default-features = false }


[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
# Host-only structural package fixtures; no std in native Root.
ev-zion = { path = "../../libs/zion", features = ["std"] }
